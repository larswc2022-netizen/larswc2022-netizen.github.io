name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compute BASE_URL
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          o=$(echo "$OWNER" | tr 'A-Z' 'a-z'); r=$(echo "$REPO" | tr 'A-Z' 'a-z')
          if [ "$r" = "$o.github.io" ]; then echo "BASE_URL=https://$o.github.io" >> "$GITHUB_ENV"
          else echo "BASE_URL=https://$o.github.io/$r" >> "$GITHUB_ENV"; fi
      - run: npm run build
      - run: npm run validate -- --online
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-http.sh "${{ needs.deploy.outputs.url }}"
